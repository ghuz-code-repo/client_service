services:
  client-service-service:
    restart: always
    image: client-service-service
    container_name: client-service-service
    build:
      context: ..
      dockerfile: client_service/Dockerfile
    labels:
      - "nginx.auth=true"  # Enable gateway authentication
    volumes:
      - ./instance:/app/instance
      - ./backups:/app/backups          # Бэкапы БД должны пережить пересборку образа
      - ./app/word_templates:/app/app/word_templates
      - ./app/templates:/app/app/templates
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:80
      - NOTIFICATION_SERVICE_URL=http://notification-service:80
      - CONTAINER_NAME=client-service-service  # For service discovery registration
    # --- Харднинг: захваченный контейнер не сможет поднять привилегии ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :80
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE       # запись в bind-mount директории
    networks:
      - service_network     # Внутренняя сеть сервисов
      - egress_network      # Доступ к внешним ресурсам: MySQL MacroCRM (172.16.0.199)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  service_network:
    external: true
    name: service_network
  data_network:
    external: true
    name: data_network
  egress_network:
    external: true
    name: egress_network